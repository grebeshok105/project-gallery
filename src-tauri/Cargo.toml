[package]
name = "project-gallery"
version = "0.1.0"
description = "Личная галерея проектов"
authors = ["grebeshok105"]
edition = "2021"

[lib]
name = "project_gallery_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["full"] }
keyring = { version = "3", features = ["windows-native"] }
thiserror = "2"
anyhow = "1"

# Форсируем ТОЧНЫЕ версии, иначе транзитивный `brotli` не компилируется.
# brotli 8.0.3 хочет alloc-no-stdlib 2.x, но свежие brotli-decompressor 5.0.2
# и alloc-stdlib 0.2.3 разрешают alloc-no-stdlib до 3.0.0 — две версии в дереве
# дают E0277 в implement_allocator. Точные пины держат всё на 2.x.
alloc-no-stdlib = "=2.0.4"
alloc-stdlib = "=0.2.2"
brotli-decompressor = "=5.0.1"

[features]
custom-protocol = ["tauri/custom-protocol"]
